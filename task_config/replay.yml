env_settings:
  frequencies:
    physical: 120
    collect: 120
    save: 60
    video: 60
    eval: 60
    render: 0

  random_texture: false
  sensor_type: gsmini
  optical_backend: taxim

collect_settings:
  save_root_dir: data
  use_seed: true
  episode_num: 10

replay_settings:
  save_root_dir: eval_result
  force_action: false
  max_episodes: 10

observation_settings:
  camera: ['rgb']
  tactile: ['rgb', 'rgb_marker', 'marker', 'depth', 'press_depth', 'pose']
  embodiment: ['joint', 'ee']
  actor: true

task_overrides:
  arm_stiffness: 1250000.0
  arm_damping: 2500.0
  reset_time_limit: 600
  planner_use_cuda_graph: false
  planner_interpolation_steps: 2000
