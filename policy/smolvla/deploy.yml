# Basic experiment configuration (keep unchanged across policies)
policy_name: smolvla
seed: 0
ckpt_setting: 50
instruction_type: seen
instuction_file: null

# ----- SmolVLA-specific deploy parameters -----
# How many actions from each predicted chunk to execute before re-running the
# VLA forward pass. 0 means "use the SmolVLAConfig.n_action_steps from the
# checkpoint" (typically 50).
smolvla_n_action_steps: 50

# Temporal aggregation buffer and exponential weighting. The deploy policy
# predicts one action chunk every step, stores it in a (1000, 1000, 9) buffer,
# and returns the exponentially weighted action for the current timestep.
smolvla_temporal_agg_max_timesteps: 1000
smolvla_temporal_agg_action_dim: 9
smolvla_temporal_agg_k: 0.01

# Input image / tactile sizes. SmolVLA's own resize_imgs_with_padding kicks in
# afterwards, so values here just standardize what we feed the processor.
# Leave null to use the checkpoint input feature shape, typically [256, 256].
smolvla_image_size: null
smolvla_tactile_size: null

# Image scale before policy processors. Use "float01" for current SmolVLA
# checkpoints; use "raw" only if eval_traj.py confirms 0-255 inputs are better.
smolvla_image_scale: float01

# Set to true if the trained checkpoint also used the marker-overlay tactile
# streams (observation.images.tactile_ll_marker / tactile_lr_marker).
# "auto" enables marker streams whenever they are present in checkpoint config.
smolvla_use_marker_variants: auto

# FastAPI inference service. By default Policy starts a local subprocess with
# policy/smolvla/.venv/bin/python on a free localhost port. Set smolvla_port
# to connect to an already-running service instead.
# smolvla_python: policy/smolvla/.venv/bin/python
# smolvla_host: 127.0.0.1
smolvla_port: 10700
# smolvla_startup_timeout: 300
# smolvla_request_timeout: 300
